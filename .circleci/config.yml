version: 2.1

executors:
  java11:
    docker:
      - image: cimg/openjdk:11.0
    environment:
      MAVEN_OPTS: -Xmx3g

jobs:
  build:
    executor: java11
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-maven-{{ checksum "pom.xml" }}
            - v1-maven-
      - run:
          name: Build
          command: mvn --batch-mode clean install -DskipTests
      - save_cache:
          paths:
            - ~/.m2
          key: v1-maven-{{ checksum "pom.xml" }}

  release:
    executor: java11
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-maven-{{ checksum "pom.xml" }}
            - v1-maven-
      - run:
          name: Configure Maven credentials
          command: |
            mkdir -p ~/.m2
            cat > ~/.m2/settings.xml \<<'EOF'
            <settings>
              <servers>
                <server>
                  <id>opennms-repo</id>
                  <username>${env.OPENNMS_JETTY_INTERNAL_REPO_USERNAME}</username>
                  <password>${env.OPENNMS_JETTY_INTERNAL_REPO_PASSWORD}</password>
                </server>
              </servers>
            </settings>
            EOF
      - run:
          name: Set version from tag
          command: |

            mvn --batch-mode versions:set \
              -DnewVersion="${CIRCLE_TAG}" \
              -DgenerateBackupPoms=false
              
            # replace the version in build-resources/pom.xml with the tag version, e.g.
            mvn --batch-mode versions:set \
              -DnewVersion="${CIRCLE_TAG}" \
              -DgenerateBackupPoms=false \
              -f build-resources/pom.xml

            
      - run:
          name: Update distributionManagement in pom.xml
          command: |
            python3 - \<<'PYEOF'
            import re

            with open('pom.xml', 'r') as f:
                content = f.read()

            new_dist = (
                '  <distributionManagement>\n'
                '    <repository>\n'
                '      <id>opennms-repo</id>\n'
                '      <name>OpenNMS jetty-internal-Repository</name>\n'
                '      <url>https://maven.opennms.org/repository/jetty-internal/</url>\n'
                '    </repository>\n'
                '  </distributionManagement>'
            )

            content = re.sub(
                r'  <distributionManagement>.*?  </distributionManagement>',
                new_dist,
                content,
                flags=re.DOTALL
            )

            with open('pom.xml', 'w') as f:
                f.write(content)
            PYEOF
      - run:
          name: Deploy to OpenNMS repository
          command: mvn --batch-mode clean deploy -DskipTests
      - save_cache:
          paths:
            - ~/.m2
          key: v1-maven-{{ checksum "pom.xml" }}

workflows:
  build-branch:
    jobs:
      - build:
          filters:
            branches:
              only:
                - onms/jetty-9.4.x
                - /jira\/NMS-.*/
            tags:
              ignore: /.*/

  release-on-tag:
    jobs:
      - release:
          context: 
            - OpenNMS-Maven-Jira-Internal-repo
          filters:
            tags:
              only: /^\d+\.\d+\.\d+\.onms\d+$/
            branches:
              ignore: /.*/
